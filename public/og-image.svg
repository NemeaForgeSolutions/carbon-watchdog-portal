<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a0e" />
      <stop offset="50%" stop-color="#0a151b" />
      <stop offset="100%" stop-color="#03080c" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#blueGlow)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Orbit Rings Illustration -->
  <g transform="translate(950, 315)">
    <circle r="220" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.25" />
    <circle r="160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.35" />
    <circle r="100" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" />
    <circle r="42" fill="#064e3b" opacity="0.6" stroke="#34d399" stroke-width="2" />
    <circle r="12" fill="#10b981" />

    <!-- Satellite Orbit Points -->
    <circle cx="160" cy="0" r="8" fill="#38bdf8" />
    <circle cx="-120" cy="130" r="6" fill="#34d399" />
    <circle cx="70" cy="-190" r="5" fill="#a7f3d0" />
  </g>

  <!-- Brand Badge & Logo -->
  <g transform="translate(100, 100)">
    <!-- Logo Icon -->
    <rect width="64" height="64" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <g transform="translate(16, 16)" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="4"/>
      <circle cx="25" cy="7" r="2.5"/>
      <circle cx="7" cy="25" r="2.5"/>
      <path d="M14 29a13 13 0 0 0 13-11"/>
      <path d="M18 3a13 13 0 0 0-13 11"/>
    </g>

    <!-- Badge Tag -->
    <g transform="translate(84, 14)">
      <rect width="210" height="36" rx="18" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.5" />
      <text x="105" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">
        SATELLITE ASSURANCE
      </text>
    </g>
  </g>

  <!-- Main Headline & Copy -->
  <g transform="translate(100, 240)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      Carbon Watchdog
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">
      Satellite-Grade Credit Integrity &amp; Buyer Risk Assurance
    </text>
    <text y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#64748b">
      Continuous orbital surveillance, claim verification, and corporate portfolio exposure intelligence.
    </text>
  </g>

  <!-- Feature Tags / Capabilities Footer -->
  <g transform="translate(100, 480)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="260" height="46" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="130" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">
        🛰️ Planetary Orbit Telemetry
      </text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(280, 0)">
      <rect width="260" height="46" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="130" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">
        🛡️ Buyer Exposure Tracking
      </text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(560, 0)">
      <rect width="260" height="46" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="130" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">
        📑 Audit-Proof Evidence Packs
      </text>
    </g>
  </g>
</svg>
